name: Release checks
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: docker build -t peacloud:${{ github.ref_name }} .
