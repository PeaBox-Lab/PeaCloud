name: Bug report
description: Report a reproducible PeaCloud problem
body:
  - type: input
    id: version
    attributes: {label: PeaCloud version}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problem and reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized logs, with credentials/customer data removed}
