name: Feature request
description: Propose a PeaCloud capability
body:
  - type: textarea
    id: user_story
    attributes: {label: User story, description: "As a <role>, I want <capability>, so that <outcome>."}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria}
    validations: {required: true}
  - type: textarea
    id: risk
    attributes: {label: Cloud permissions / security / destructive-operation impact}
