<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeaCloud</title><link rel="stylesheet" href="/static/style.css"></head><body>
<aside><div class="brand">☁ PeaCloud <small>v0.1.0</small></div><nav><button data-view="dashboard" class="active">Dashboard</button><button data-view="inventory">Inventory</button><button data-view="connections">Connections</button><button data-view="operations">Operations</button></nav><div class="mode">Safe mode<br><b>Real changes disabled</b></div></aside>
<main><header><div><h1 id="title">Dashboard</h1><p>Unified operations for AWS, Azure, Google Cloud and more</p></div><select id="role"><option>operator</option><option>viewer</option><option>admin</option></select></header>
<section id="dashboard" class="view"><div class="cards" id="cards"></div><div class="panel"><h2>Resource overview</h2><div id="overview"></div></div></section>
<section id="inventory" class="view hidden"><div class="toolbar"><input id="search" placeholder="Search resources"><select id="providerFilter"><option value="">All providers</option><option>mock</option><option>aws</option><option>azure</option><option>gcp</option></select><button onclick="loadResources()">Refresh</button></div><div class="panel"><table><thead><tr><th>Name</th><th>Provider</th><th>Type</th><th>Region</th><th>State</th><th>Actions</th></tr></thead><tbody id="resources"></tbody></table></div></section>
<section id="connections" class="view hidden"><div class="grid" id="connectionsGrid"></div></section>
<section id="operations" class="view hidden"><div class="panel"><table><thead><tr><th>Time</th><th>Provider</th><th>Resource</th><th>Action</th><th>Status</th><th>Detail</th></tr></thead><tbody id="ops"></tbody></table></div></section>
<div id="toast"></div></main><script src="/static/app.js"></script></body></html>
